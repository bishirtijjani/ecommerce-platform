<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../brand.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body>
  <div class="canvas">
    <header class="head">
      <div class="eyebrow">Product</div>
      <h1 class="headline">Talk to the<br><span class="o">seller.</span></h1>
      <p class="sub">Ask about price, stock or a deal - then buy with confidence.</p>
    </header>
    <div class="stage">
      <div class="phone"><div class="screen">
        <div data-statusbar></div>
        <div class="app">
          <div class="appbar">
            <div class="back">&#8592;</div>
            <div class="h1" style="flex:1">Product</div>
            <div class="ic">&#9825;</div>
          </div>
          <div class="hero">&#128717;</div>
          <div class="row" style="gap:1.2em">
            <div class="thumbbar"><div class="t on">&#128717;</div><div class="t">&#129689;</div><div class="t">&#9986;</div><div class="t">&#128142;</div></div>
          </div>
          <div class="stack" style="gap:.8em">
            <div class="pd-title">Embroidered Ankara gown</div>
            <div class="between">
              <div class="pd-price">&#8358;18,000</div>
              <span class="badge new">New</span>
            </div>
            <div class="row"><span class="stars">&#9733;&#9733;&#9733;&#9733;&#9734;</span><span class="mut sm">4.6 &middot; 32 sold</span></div>
          </div>
          <div class="trust">
            <div class="t">&#10003; Verified vendor</div>
            <div class="t">&#128274; Secure &amp; private</div>
          </div>
          <div class="row" style="gap:1.4em">
            <div class="btn ghost half">&#128222; Call</div>
            <div class="btn brand half">&#128172; Chat with seller</div>
          </div>
          <div class="btn ghost">&#128222; Request a callback</div>
        </div>
      </div></div>
    </div>
    <footer class="foot">
      <div class="lockup"><span class="brand">Marketplace</span></div>
      <div class="url">marketplace.ng</div>
    </footer>
    <div class="bottombar"></div>
  </div>
  <script src="frame.js"></script>
</body>
</html>
