<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../brand.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body>
  <div class="canvas">
    <header class="head">
      <div class="eyebrow">Requests</div>
      <h1 class="headline">Can&rsquo;t find it?<br><span class="o">Ask.</span></h1>
      <p class="sub">Post what you need - nearby sellers send you offers with a price.</p>
    </header>
    <div class="stage">
      <div class="phone"><div class="screen">
        <div data-statusbar></div>
        <div class="app">
          <div class="appbar">
            <div class="back">&#8592;</div>
            <div class="h1" style="flex:1">New request</div>
          </div>
          <div class="field">
            <div class="label">What do you need?</div>
            <div class="value">Original iPhone 15 charger, sealed</div>
          </div>
          <div class="field">
            <div class="label">Photos</div>
            <div class="photostrip" style="margin-top:1em">
              <div class="ph">&#128241;</div>
              <div class="ph add">&#43;</div>
            </div>
          </div>
          <div class="segrow">
            <div class="seg on">Nearby</div>
            <div class="seg">Anywhere</div>
          </div>
          <div class="between">
            <div class="field" style="flex:1"><div class="label">Budget</div><div class="value">&#8358;20k &ndash; &#8358;35k</div></div>
            <div class="field" style="flex:1"><div class="label">Urgency</div><div class="value">Today</div></div>
          </div>
          <div class="mapstrip"><div class="pin">&#128205;</div></div>
          <div class="btn brand">Post request</div>
        </div>
      </div></div>
    </div>
    <footer class="foot">
      <div class="lockup"><span class="brand">MySooq</span></div>
      <div class="url">mysooq.ng</div>
    </footer>
    <div class="bottombar"></div>
  </div>
  <script src="frame.js"></script>
</body>
</html>
